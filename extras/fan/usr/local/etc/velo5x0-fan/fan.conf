# velo5x0 OPNsense fan control. Temperatures in C; duties 0..255.
# CPU = hottest dev.cpu.N.temperature (coretemp).
[fan]
off_c = 50
on_c = 60
full_c = 80
# curve mode only (Edge 540); measured on a 540 stock fan
stall_free_duty = 24
kick_duty = 255
kick_s = 2
poll_s = 2
stall_polls = 3
stall_kicks = 3
# drive input: smartctl only (no drivetemp on FreeBSD); no-op without it
drive_off_c = 55
drive_on_c = 60
drive_ramp_c = 65
drive_full_c = 70
drive_min_duty = 69
# Minimum run: each time drive demand turns on, it holds at least
# drive_min_duty this many seconds. 0 = off.
drive_min_run_s = 600
# on/off mode (Edge 520 v2). auto = onoff on edge520b, curve elsewhere.
# In onoff the duty is only 0 or 255: ON at >= on_c (or any drive demand),
# OFF at <= off_c with no drive demand, after onoff_min_run_s ON.
mode = auto
onoff_min_run_s = 600
# measured on an Edge 520 v2: first valid tach 0.3-0.7 s after ON, ~baseline by 2.5-3 s
spinup_window_s = 5
restart_tolerance = 0.15
restart_tries = 3
