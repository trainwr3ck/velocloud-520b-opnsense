# Policy for /usr/local/etc/rc.syshook.d/early/10-switch
#
# MODE
#   verify     (default) - do not touch the switch. e6000sw_init_vlan() already
#              installs a flat bridge over every enabled port, which is the
#              vendor behaviour. Just dump state to the serial console.
#   configure - apply $SPEC with etherswitchcfg, then re-dump.
#
# WAIT   seconds to wait for /dev/etherswitchN to appear
# SPEC   file of etherswitchcfg invocations, one per line
#
# Everything is env-overridable (VCE520B_SWITCH_MODE / _WAIT / _SPEC) so the
# topology can be retuned from a serial console without editing files.

MODE=verify
WAIT=20
UNITS="0 1"
SPEC=/usr/local/etc/vce520b-switch.spec
