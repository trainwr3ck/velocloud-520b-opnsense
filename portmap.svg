    <rect x="40" y="307" width="160" height="190" rx="7" fill="#f2f2f2" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="120" y="333" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">SFP cage</text>
    <text x="120" y="363" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">igb1</text>
