    <text x="808" y="158" font-size="20" font-weight="bold" fill="#111" text-anchor="middle">igb2</text>
    <text x="808" y="184" font-size="13" fill="#444" text-anchor="middle">PCI 0:20.0</text>
    <text x="808" y="206" font-size="13" fill="#444" text-anchor="middle">etherswitch0 port2</text>
    <text x="808" y="232" font-size="13" fill="#444" text-anchor="middle">linked 0x796d</text>
