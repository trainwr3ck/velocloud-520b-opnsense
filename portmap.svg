    <text x="292" y="459" font-size="13" fill="#777" text-anchor="middle">same bit-banged bus</text>
  </g>
  <g>
    <rect x="384" y="307" width="160" height="190" rx="7" fill="#dde9f5" stroke="#2a5d8f" stroke-width="2"/>
