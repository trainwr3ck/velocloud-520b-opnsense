    <text x="636" y="158" font-size="20" font-weight="bold" fill="#111" text-anchor="middle">igb3</text>
    <text x="636" y="184" font-size="13" fill="#444" text-anchor="middle">PCI 0:20.1</text>
    <text x="636" y="206" font-size="13" fill="#444" text-anchor="middle">etherswitch1 port3</text>
