    <text x="292" y="158" font-size="20" font-weight="bold" fill="#111" text-anchor="middle">igb4</text>
    <text x="292" y="184" font-size="13" fill="#444" text-anchor="middle">PCI 0:20.2</text>
    <text x="292" y="206" font-size="13" fill="#444" text-anchor="middle">88E1514 PHY</text>
    <text x="292" y="232" font-size="13" font-weight="bold" fill="#2f7d32" text-anchor="middle">WAN — DHCP client</text>
    <text x="292" y="254" font-size="13" fill="#2f7d32" text-anchor="middle">cable this one first</text>
  </g>
  <g>
    <rect x="384" y="102" width="160" height="190" rx="7" fill="#dde9f5" stroke="#2a5d8f" stroke-width="2"/>
    <text x="464" y="128" font-size="14" font-weight="bold" fill="#2a5d8f" text-anchor="middle">RJ45 — LAN1</text>
