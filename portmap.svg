  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>

  <text x="40" y="38" font-size="25" font-weight="bold" fill="#111">VeloCloud Edge 520B — rear panel, as you face the back of the box</text>
  <text x="40" y="64" font-size="14" fill="#444">Jack map. 2 rows x 6 sockets = 12. Columns numbered left to right.</text>

  <!-- I/O shield outline -->
  <rect x="32" y="92" width="1036" height="412" rx="10" fill="none" stroke="#bbb" stroke-width="1.5"/>

  <!-- column numbers -->
  <text x="120" y="88" font-size="14" fill="#555" text-anchor="middle">col 1</text>
  <text x="292" y="88" font-size="14" fill="#555" text-anchor="middle">col 2</text>
  <text x="464" y="88" font-size="14" fill="#555" text-anchor="middle">col 3</text>
  <text x="636" y="88" font-size="14" fill="#555" text-anchor="middle">col 4</text>
  <text x="808" y="88" font-size="14" fill="#555" text-anchor="middle">col 5</text>
  <text x="980" y="88" font-size="14" fill="#555" text-anchor="middle">col 6</text>

  <!-- row labels -->
  <text x="20" y="197" font-size="15" font-weight="bold" fill="#111" transform="rotate(-90 20 197)" text-anchor="middle">TOP ROW</text>
  <text x="20" y="402" font-size="15" font-weight="bold" fill="#111" transform="rotate(-90 20 402)" text-anchor="middle">BOTTOM ROW</text>

  <!-- ================= TOP ROW ================= -->
  <g>
    <rect x="40" y="102" width="160" height="190" rx="7" fill="#f2f2f2" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="120" y="128" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">SFP cage</text>
    <text x="120" y="158" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">igb0</text>
    <text x="120" y="184" font-size="13" fill="#555" text-anchor="middle">PCI 4:0.0</text>
    <text x="120" y="206" font-size="13" fill="#555" text-anchor="middle">Intel I350 SFP</text>
    <text x="120" y="232" font-size="13" fill="#888" text-anchor="middle">stock igb driver</text>
    <text x="120" y="254" font-size="13" fill="#888" text-anchor="middle">not touched by us</text>
  </g>
  <g>
    <rect x="212" y="102" width="160" height="190" rx="7" fill="#dff0dc" stroke="#2f7d32" stroke-width="2.5"/>
