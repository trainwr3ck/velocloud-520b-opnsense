<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="279.4mm" height="215.9mm"
     viewBox="0 0 1100 850" font-family="DejaVu Sans, Verdana, sans-serif">
  <style>
    @page { size: 11in 8.5in; margin: 0; }
