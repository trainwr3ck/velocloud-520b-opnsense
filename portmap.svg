    <text x="120" y="437" font-size="13" fill="#888" text-anchor="middle">stock igb driver</text>
    <text x="120" y="459" font-size="13" fill="#888" text-anchor="middle">not touched by us</text>
  </g>
  <g>
    <rect x="212" y="307" width="160" height="190" rx="7" fill="#f0f0f0" stroke="#777" stroke-width="1.5"/>
    <text x="292" y="333" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">RJ45 — WAN1</text>
