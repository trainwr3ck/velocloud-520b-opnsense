    <text x="464" y="206" font-size="13" fill="#444" text-anchor="middle">etherswitch1 port1</text>
    <text x="464" y="232" font-size="13" fill="#444" text-anchor="middle">linked 0x796d</text>
    <text x="464" y="254" font-size="13" fill="#2a5d8f" text-anchor="middle">LAN bridge</text>
  </g>
